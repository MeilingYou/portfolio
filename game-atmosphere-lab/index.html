<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Atmosphere Lab</title>
  <meta name="description" content="Explore how video game art styles, colors, fonts, and sounds create different moods.">
  <meta name="theme-color" content="#F3E7C9">

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">

  <!-- iOS PWA support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="AtmoLab">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700&family=Cinzel:wght@400;700&family=Creepster&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Game Atmosphere Lab</h1>
    <p>Explore how video game art styles, colors, fonts, and sounds create different moods.</p>
  </header>
  <main>
    <section class="menu-section">
      <h2>Choose an Atmosphere</h2>
      <div id="topicMenu" class="topic-menu"></div>
    </section>
    <section class="content-card">
      <div class="image-box">
        <img id="topicImage" src="" alt="">
      </div>
      <div class="info-box">
        <h2 id="topicTitle">Topic Title</h2>
        <p id="gameExamples"></p>
        <h3>Art Style</h3>
        <p id="artStyle"></p>
        <h3>Mood</h3>
        <p id="mood"></p>
        <h3>Why It Creates This Atmosphere</h3>
        <p id="description"></p>
        <button id="audioBtn">Play Atmosphere Sound</button>
      </div>
    </section>
  </main>
  <footer>
    <p>Game Atmosphere Lab | Educational PWA Project</p>
     <p>
    <a href="promo.html">About</a> &nbsp;|&nbsp;
    <a href="docs/user-guide.html">User Guide</a> &nbsp;|&nbsp;
    <a href="docs/programmer-guide.html">Dev Docs</a>
  </p>
  </footer>
  <script src="script.js"></script>
  <script>
    // Register Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("service-worker.js")
          .then(reg => console.log("[SW] Registered:", reg.scope))
          .catch(err => console.log("[SW] Registration failed:", err));
      });
    }
  </script>
</body>
</html>
