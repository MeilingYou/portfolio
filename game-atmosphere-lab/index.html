<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Required viewport for responsive design -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Atmosphere Lab</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700&family=Cinzel:wght@400;700&family=Creepster&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">

  <!-- CSS file -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>Game Atmosphere Lab</h1>
    <p>Explore how video game art styles, colors, fonts, and sounds create different moods.</p>
  </header>

  <main>
    <!-- Topic menu will be filled by JavaScript from data.json -->
    <section class="menu-section">
      <h2>Choose an Atmosphere</h2>
      <div id="topicMenu" class="topic-menu"></div>
    </section>

    <!-- Topic display area -->
    <section class="content-card">
      <div class="image-box">
        <img id="topicImage" src="" alt="Game atmosphere illustration">
      </div>

      <div class="info-box">
        <h2 id="topicTitle">Topic Title</h2>
        <p id="gameExample"></p>

        <h3>Art Style</h3>
        <p id="artStyle"></p>

        <h3>Mood</h3>
        <p id="mood"></p>

        <h3>Why It Creates This Atmosphere</h3>
        <p id="description"></p>

        <button id="audioBtn">Play Atmosphere Sound</button>
      </div>
    </section>
  </main>

  <footer>
    <p>Game Atmosphere Lab | Educational PWA Project</p>
  </footer>

  <!-- JavaScript file -->
  <script src="script.js"></script>
</body>
</html>
