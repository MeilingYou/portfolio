<!-- INFO CARD -->
<section class="content-card">
  <div class="image-box">
    <img 
      id="topicImage" 
      src="screenshots/cozy-pixel-farming-1.jpg" 
      alt="Cozy Pixel Farming"
    >
  </div>

  <div class="info-box">
    <h2 id="topicTitle">Topic Title</h2>
    <p id="gameExamples"></p>

    <div class="palette-section">
      <span class="palette-label">Color Palette</span>
      <div class="palette-swatches" id="paletteSwatches"></div>
    </div>

    <h3>Art Style</h3>
    <p id="artStyle"></p>

    <h3>Mood</h3>
    <p id="mood"></p>

    <h3>Why It Creates This Atmosphere</h3>
    <p id="description"></p>

    <button id="audioBtn">Play Atmosphere Sound</button>
  </div>
</section>

<!-- SCREENSHOT GALLERY -->
<section class="media-gallery">
  <div class="gallery-header">
    <span class="gallery-label">// Screenshots</span>
    <h2 class="gallery-title" id="galleryTitle">Atmosphere Showcase</h2>
    <p class="gallery-subtitle">Click any screenshot to view fullscreen</p>
  </div>

  <div class="gallery-main">
    <div class="gallery-display" id="galleryDisplay">
      <img 
        id="galleryMainImg" 
        src="screenshots/cozy-pixel-farming-1.jpg" 
        alt="Atmosphere screenshot" 
        class="gallery-main-img"
      >

      <div class="gallery-caption" id="galleryCaption"></div>

      <div class="gallery-expand-hint">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="15 3 21 3 21 9"/>
          <polyline points="9 21 3 21 3 15"/>
          <line x1="21" y1="3" x2="14" y2="10"/>
          <line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
        Click to expand
      </div>
    </div>

    <!-- JavaScript will place the 3 screenshots here -->
    <div class="gallery-strip" id="galleryStrip"></div>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()">✕</button>
    <button class="lightbox-prev" id="lightboxPrev" onclick="lightboxNav(-1,event)">&#8249;</button>
    <button class="lightbox-next" id="lightboxNext" onclick="lightboxNav(1,event)">&#8250;</button>

    <img 
      class="lightbox-img" 
      id="lightboxImg" 
      src="screenshots/cozy-pixel-farming-1.jpg" 
      alt="Expanded screenshot" 
      onclick="event.stopPropagation()"
    >

    <div class="lightbox-caption" id="lightboxCaption"></div>
    <div class="lightbox-counter" id="lightboxCounter"></div>
  </div>
</section>
