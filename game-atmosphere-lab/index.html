<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Game Atmosphere Lab</title>

  <meta name="description" content="An educational PWA about video game atmosphere.">
  <meta name="theme-color" content="#7aa35a">

  <link rel="manifest" href="/portfolio/game-atmosphere-lab/manifest.json">
  <link rel="apple-touch-icon" href="/portfolio/game-atmosphere-lab/icons/icon-192.png">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3e7c9;
      color: #2e2218;
    }

    header {
      background: #7aa35a;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
    }

    header p {
      margin: 10px auto 0;
      max-width: 700px;
      line-height: 1.5;
    }

    nav {
      text-align: center;
      padding: 15px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
    }

    nav a {
      color: #2e2218;
      text-decoration: none;
      font-weight: bold;
      margin: 0 10px;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      justify-content: center;
    }

    .menu button {
      border: none;
      background: #7aa35a;
      color: white;
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .menu button:hover {
      background: #5d8543;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }

    .card img {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      border-radius: 10px;
      background: #ddd;
    }

    .info {
      margin-top: 20px;
    }

    .info h2 {
      margin-top: 0;
    }

    .label {
      font-weight: bold;
      color: #5d8543;
    }

    audio {
      width: 100%;
      margin-top: 15px;
    }

    footer {
      text-align: center;
      padding: 20px;
      margin-top: 30px;
      background: #ffffff;
      border-top: 1px solid #ddd;
    }
  </style>
</head>

<body>

  <header>
    <h1>Game Atmosphere Lab</h1>
    <p>
      Learn how video game art styles, colors, images, and sounds create different moods.
    </p>
  </header>

  <nav>
    <a href="index.html">App</a>
    <a href="promo.html">Promo Page</a>
    <a href="manifest.json">Manifest</a>
    <a href="service-worker.js">Service Worker</a>
  </nav>

  <main>
    <h2>Choose a Topic</h2>

    <div id="topicMenu" class="menu"></div>

    <section class="card">
      <img id="topicImage" src="" alt="Topic image">

      <div class="info">
        <h2 id="topicTitle">Loading...</h2>

        <p>
          <span class="label">Game Examples:</span>
          <span id="gameExamples"></span>
        </p>

        <p>
          <span class="label">Art Style:</span>
          <span id="artStyle"></span>
        </p>

        <p>
          <span class="label">Mood:</span>
          <span id="mood"></span>
        </p>

        <p>
          <span class="label">Description:</span>
          <span id="description"></span>
        </p>

        <audio id="topicAudio" controls></audio>
      </div>
    </section>
  </main>

  <footer>
    Educational PWA Project
  </footer>

  <script>
    function registerServiceWorker() {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/portfolio/game-atmosphere-lab/service-worker.js", {
          scope: "/portfolio/game-atmosphere-lab/"
        })
        .then(function (registration) {
          console.log("Service worker registered:", registration.scope);
        })
        .catch(function (error) {
          console.log("Service worker registration failed:", error);
        });
      }
    }

    function loadData() {
      fetch("data.json")
        .then(function (response) {
          return response.json();
        })
        .then(function (data) {
          const topics = data.topics;
          buildMenu(topics);
          showTopic(topics[0]);
        })
        .catch(function (error) {
          console.log("Could not load data.json:", error);
          document.getElementById("topicTitle").textContent = "Could not load data.";
        });
    }

    function buildMenu(topics) {
      const menu = document.getElementById("topicMenu");
      menu.innerHTML = "";

      topics.forEach(function (topic) {
        const button = document.createElement("button");
        button.textContent = topic.title;

        button.addEventListener("click", function () {
          showTopic(topic);
        });

        menu.appendChild(button);
      });
    }

    function showTopic(topic) {
      document.getElementById("topicTitle").textContent = topic.title;
      document.getElementById("gameExamples").textContent = topic.gameExamples.join(", ");
      document.getElementById("artStyle").textContent = topic.artStyle;
      document.getElementById("mood").textContent = topic.mood;
      document.getElementById("description").textContent = topic.description;

      document.getElementById("topicImage").src = topic.image;
      document.getElementById("topicImage").alt = topic.imageAlt || topic.title;

      document.getElementById("topicAudio").src = topic.audio;

      document.body.style.backgroundColor = topic.backgroundColor || "#f3e7c9";
      document.querySelector("header").style.backgroundColor = topic.accentColor || "#7aa35a";
    }

    window.addEventListener("load", function () {
      registerServiceWorker();
      loadData();
    });
  </script>

</body>
</html>
